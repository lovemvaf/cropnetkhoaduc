name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci

      - name: Generate Prisma Client 🗄️
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Run automated security & AI test suite 🧪
        run: npm test

      - name: Build web application 🏗️
        env:
          NODE_ENV: production
          DEPLOY_TARGET: github-pages
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_BASE_PATH: /cropnetkhoaduc
        run: |
          npm run build:web
          touch apps/web/out/.nojekyll

      - name: Deploy static files to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/out
          branch: gh-pages
          clean: true
