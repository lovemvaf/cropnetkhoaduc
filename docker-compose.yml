version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: cropnet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super-secure-db-password-123
      POSTGRES_DB: cropnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cropnet-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:super-secure-db-password-123@database:5432/cropnet?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 1d
      PORT: 5000
      BACKEND_URL: http://localhost:5000
      # Cloudinary and Momo configurations (can be overridden by .env at launch)
      CLOUDINARY_CLOUD_NAME: your-cloudinary-name
      CLOUDINARY_API_KEY: your-api-key
      CLOUDINARY_API_SECRET: your-api-secret
      MOMO_PARTNER_CODE: MOMOBKUN20180529
      MOMO_ACCESS_KEY: klm05iv7zzHM51aE
      MOMO_SECRET_KEY: at13s12W205y125s...
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/apps/server/uploads
      - logs_data:/usr/src/app/apps/server/logs
    restart: always

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cropnet-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  uploads_data:
  logs_data:
